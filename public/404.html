<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | OpenSource Radar</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff; --text: #1f2328; --muted: #59636e; --accent: #1f883d; --link: #0969da;
        --border: #d1d9e0; --chip: #f6f8fa;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0d1117; --text: #f0f6fc; --muted: #9198a1; --accent: #238636; --link: #4493f8; --border: #3d444d; --chip: #151b23; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: 100%; max-width: 34rem; padding: 2.5rem 1rem; text-align: center; }
      .logo { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text); font-weight: 700; text-decoration: none; }
      .code { margin: 1.5rem 0 0; color: var(--muted); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.08em; }
      h1 { margin: 0.4rem 0 0.6rem; font-size: 1.6rem; }
      p { margin: 0 0 1.2rem; color: var(--muted); line-height: 1.5; }
      form { display: flex; gap: 0.5rem; margin: 0 auto 1.5rem; max-width: 26rem; }
      label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      input { flex: 1; min-width: 0; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: 6px;
        background: transparent; color: inherit; font: inherit; }
      button { padding: 0.6rem 1rem; border: 0; border-radius: 6px; background: var(--accent); color: #ffffff;
        font: inherit; font-weight: 600; cursor: pointer; }
      h2 { margin: 0 0 0.6rem; font-size: 0.95rem; }
      ul { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin: 0 0 1.5rem; padding: 0; list-style: none; }
      ul a { display: inline-block; padding: 0.3rem 0.75rem; border: 1px solid var(--border); border-radius: 999px;
        background: var(--chip); color: var(--text); font-size: 0.9rem; text-decoration: none; }
      ul a:hover, ul a:focus-visible { border-color: var(--link); }
      .more a { color: var(--link); white-space: nowrap; }
      .more { font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <main>
      <a class="logo" href="/"><img src="/favicon.svg" alt="" width="28" height="28" /> OpenSource Radar</a>
      <p class="code">404</p>
      <h1>This page wandered off.</h1>
      <p>The link may be old or mistyped. Let&rsquo;s find you an issue to work on instead.</p>

      <form action="/" method="get" role="search">
        <label for="q">Search good first issues</label>
        <input id="q" name="q" type="search" placeholder="Search good first issues" autocomplete="off" />
        <input type="hidden" name="labels" value="good-first-issue" />
        <input type="hidden" name="available" value="1" />
        <button type="submit">Search</button>
      </form>

      <h2>Or pick a language</h2>
      <ul>
        <li><a href="/good-first-issues/python">Python</a></li>
        <li><a href="/good-first-issues/javascript">JavaScript</a></li>
        <li><a href="/good-first-issues/typescript">TypeScript</a></li>
        <li><a href="/good-first-issues/java">Java</a></li>
        <li><a href="/good-first-issues/go">Go</a></li>
        <li><a href="/good-first-issues/rust">Rust</a></li>
        <li><a href="/good-first-issues/cpp">C++</a></li>
      </ul>

      <p class="more">
        <a href="/">All good first issues</a> &middot;
        <a href="/first-contribution">Your first contribution</a> &middot;
        <a href="/for-maintainers">For maintainers</a>
      </p>
    </main>
  </body>
</html>
