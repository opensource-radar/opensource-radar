<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You're offline | OpenSource Radar</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --text: #1f2328; --muted: #59636e; --accent: #1f883d; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --text: #f0f6fc; --muted: #9198a1; --accent: #3fb950; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { max-width: 26rem; padding: 2rem 1.5rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
      p { color: var(--muted); line-height: 1.5; }
      button { margin-top: 1rem; padding: 0.6rem 1.2rem; border: 0; border-radius: 6px; background: var(--accent);
        color: #ffffff; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" width="64" height="64" />
      <h1>You're offline</h1>
      <p>OpenSource Radar searches GitHub live, so it needs a connection. Your saved issues are still kept in this browser.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
